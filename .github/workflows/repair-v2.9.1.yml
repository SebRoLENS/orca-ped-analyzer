name: Repair v2.9.1 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-v2.9.1.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Rebuild and attach v2.9.1 desktop applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh workflow run build-desktop-apps.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref=v2.9.1

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/build-desktop-apps.yml/runs?event=workflow_dispatch&head_sha=${SHA}&per_page=10" \
                --jq '.workflow_runs[0].id // empty'
            )"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 4
          done

          if [ -z "$RUN_ID" ]; then
            echo 'Could not locate the repair build run.'
            exit 1
          fi

          echo "Repair build run: $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Find and apply the v2.9.1 Zenodo DOI
        id: zenodo
        run: |
          DOI=""
          for attempt in $(seq 1 20); do
            set +e
            DOI="$(python3 .github/scripts/sync_zenodo_doi.py --version 2.9.1 2>/dev/null)"
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ] && [ -n "$DOI" ]; then
              break
            fi
            echo "Zenodo record not visible yet (attempt ${attempt}/20)."
            sleep 30
          done

          if [ -z "$DOI" ]; then
            echo 'Zenodo DOI for v2.9.1 was not found.'
            exit 1
          fi

          python3 .github/scripts/sync_zenodo_doi.py --version 2.9.1 --apply >/dev/null
          echo "doi=$DOI" >> "$GITHUB_OUTPUT"
          echo "Found DOI: $DOI"

      - name: Commit DOI metadata
        env:
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CITATION.cff
          if ! git diff --cached --quiet; then
            git commit -m "Link v2.9.1 to Zenodo DOI ${DOI}"
            git push origin HEAD:main
          fi

      - name: Update v2.9.1 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## ORCA PED Analyzer v2.9.1

          Automated release generated after an update to ORCA PED Analyzer.

          Desktop applications are available for Linux x86_64, Windows x86_64,
          macOS Apple Silicon, and macOS Intel.

          **Zenodo DOI:** https://doi.org/${DOI}
          EOF

          gh release edit v2.9.1 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/release-notes.md
