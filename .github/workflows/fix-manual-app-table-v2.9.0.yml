name: Fix manual app package layout

on:
  push:
    paths:
      - '.github/workflows/fix-manual-app-table-v2.9.0.yml'

permissions:
  contents: write

jobs:
  fix-manual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Replace wide package table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ORCA_PED_Analyzer_Manual.md')
          text = p.read_text(encoding='utf-8')
          old = '''| Platform | Package | Notes |
          |---|---|---|
          | Linux x86_64 | `ORCA-PED-Analyzer-Linux-x86_64.AppImage` | portable AppImage |
          | Windows x86_64 | `ORCA-PED-Analyzer.exe` | standalone executable |
          | macOS Apple Silicon | `ORCA-PED-Analyzer-macOS-arm64.dmg` | for Apple M-series Macs |
          | macOS Intel x86_64 | `ORCA-PED-Analyzer-macOS-x86_64.dmg` | for Intel-based Macs |
          '''
          # The source file has no indentation; normalize the literal used above.
          old = '\n'.join(line.strip() for line in old.splitlines()) + '\n'
          new = '''- **Linux x86_64:** `ORCA-PED-Analyzer-Linux-x86_64.AppImage` - portable AppImage.
          - **Windows x86_64:** `ORCA-PED-Analyzer.exe` - standalone executable.
          - **macOS Apple Silicon:** `ORCA-PED-Analyzer-macOS-arm64.dmg` - for Apple M-series Macs.
          - **macOS Intel x86_64:** `ORCA-PED-Analyzer-macOS-x86_64.dmg` - for Intel-based Macs.
          '''
          new = '\n'.join(line.strip() for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('Package table not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Build PDF manual
        run: |
          pandoc docs/ORCA_PED_Analyzer_Manual.md --from markdown --pdf-engine=xelatex --output docs/ORCA_PED_Analyzer_Manual.pdf

      - name: Upload fixed manual PDF
        uses: actions/upload-artifact@v4
        with:
          name: ORCA-PED-Analyzer-Manual-v2.9.0-fixed
          path: docs/ORCA_PED_Analyzer_Manual.pdf
          if-no-files-found: error

      - name: Commit layout fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ORCA_PED_Analyzer_Manual.md docs/ORCA_PED_Analyzer_Manual.pdf
          git commit -m 'Fix desktop application layout in manual PDF'
          git push origin HEAD:main
