name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk wget

      - name: Create build environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt 'pyinstaller==6.21.0'
          .venv/bin/python -c 'import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print("GUI imports OK")'

      - name: Build Linux application
        run: |
          .venv/bin/pyinstaller --noconfirm --clean --windowed --onedir --name ORCA-PED-Analyzer orca_ped_analyzer_gui.py
          mkdir -p ORCA-PED-Analyzer.AppDir/usr/bin
          cp -a dist/ORCA-PED-Analyzer/. ORCA-PED-Analyzer.AppDir/usr/bin/
          cp packaging/orca-ped-analyzer.svg ORCA-PED-Analyzer.AppDir/orca-ped-analyzer.svg
          cp packaging/orca-ped-analyzer.svg ORCA-PED-Analyzer.AppDir/.DirIcon
          cat > ORCA-PED-Analyzer.AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ORCA-PED-Analyzer" "$@"
          EOF
          chmod +x ORCA-PED-Analyzer.AppDir/AppRun
          cat > ORCA-PED-Analyzer.AppDir/orca-ped-analyzer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ORCA PED Analyzer
          Comment=PED and vibrational-mode analysis for ORCA Hessian/VPT2 outputs
          Exec=ORCA-PED-Analyzer
          Icon=orca-ped-analyzer
          Terminal=false
          Categories=Science;Education;
          EOF
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage ORCA-PED-Analyzer.AppDir ORCA-PED-Analyzer-Linux-x86_64.AppImage
          chmod +x ORCA-PED-Analyzer-Linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: ORCA-PED-Analyzer-Linux-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows executable (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==6.21.0"
          python -c "import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print('GUI imports OK')"
      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name ORCA-PED-Analyzer orca_ped_analyzer_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: dist/ORCA-PED-Analyzer.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller==6.21.0'
          python -c 'import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print("GUI imports OK")'
      - name: Build macOS Apple Silicon application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name 'ORCA PED Analyzer' orca_ped_analyzer_gui.py
          mkdir dmg-stage
          ditto 'dist/ORCA PED Analyzer.app' 'dmg-stage/ORCA PED Analyzer.app'
          hdiutil create -volname 'ORCA PED Analyzer' -srcfolder dmg-stage -ov -format UDZO ORCA-PED-Analyzer-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: ORCA-PED-Analyzer-macOS-arm64.dmg
          if-no-files-found: error

  macos-intel:
    name: macOS DMG (Intel x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller==6.21.0'
          python -c 'import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print("GUI imports OK")'
      - name: Build macOS Intel application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name 'ORCA PED Analyzer' orca_ped_analyzer_gui.py
          mkdir dmg-stage
          ditto 'dist/ORCA PED Analyzer.app' 'dmg-stage/ORCA PED Analyzer.app'
          hdiutil create -volname 'ORCA PED Analyzer' -srcfolder dmg-stage -ov -format UDZO ORCA-PED-Analyzer-macOS-x86_64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x86_64
          path: ORCA-PED-Analyzer-macOS-x86_64.dmg
          if-no-files-found: error

  publish-release-assets:
    name: Attach desktop builds to tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-appimage, windows-exe, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
