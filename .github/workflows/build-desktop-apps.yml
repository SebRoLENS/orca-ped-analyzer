name: Build desktop applications

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Tag, branch, or commit to build (defaults to the triggering ref)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare-icons:
    name: Prepare desktop icons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install icon conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate PNG, ICO and ICNS from the repository icon
        run: |
          mkdir -p generated-icons

          # The canonical repository asset keeps the historical .svg path.
          # Detect its actual contents so a raster image copied over that path
          # is handled safely as well.
          if python3 - <<'PY'
          from pathlib import Path
          raw = Path('packaging/orca-ped-analyzer.svg').read_bytes()[:8192].lower()
          raise SystemExit(0 if b'<svg' in raw else 1)
          PY
          then
            echo 'Icon source detected as SVG.'
            rsvg-convert \
              --width 1024 \
              --height 1024 \
              packaging/orca-ped-analyzer.svg \
              -o generated-icons/icon-source.png
          else
            echo 'Icon source detected as raster image.'
            python3 - <<'PY'
          from PIL import Image
          image = Image.open('packaging/orca-ped-analyzer.svg').convert('RGBA')
          image.save('generated-icons/icon-source.png', 'PNG')
          PY
          fi

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open('generated-icons/icon-source.png').convert('RGBA')
          source.thumbnail((1024, 1024), Image.Resampling.LANCZOS)

          canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          x = (1024 - source.width) // 2
          y = (1024 - source.height) // 2
          canvas.alpha_composite(source, (x, y))

          png = Path('generated-icons/orca-ped-analyzer.png')
          ico = Path('generated-icons/orca-ped-analyzer.ico')
          icns = Path('generated-icons/orca-ped-analyzer.icns')

          canvas.save(png, 'PNG', optimize=True)
          canvas.save(
              ico,
              'ICO',
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48),
                     (64, 64), (128, 128), (256, 256)],
          )
          canvas.save(icns, 'ICNS')

          for path in (png, ico, icns):
              with Image.open(path) as check:
                  check.verify()
              if path.stat().st_size == 0:
                  raise SystemExit(f'Generated icon is empty: {path}')
              print(f'Validated {path} ({path.stat().st_size} bytes)')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-icons
          path: generated-icons/orca-ped-analyzer.*
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (x86_64)
    needs: prepare-icons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          name: desktop-icons
          path: generated-icons

      - name: Read application version
        run: |
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', Path('orca_ped_analyzer.py').read_text(), re.M)
          if not m:
              raise SystemExit('Version not found')
          print(m.group(1))
          PY
          )"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install system build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk wget xvfb

      - name: Create build environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt 'pyinstaller==6.21.0'
          .venv/bin/python -c 'import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print("GUI imports OK")'
          .venv/bin/python -c 'from PIL import _imagingtk, _tkinter_finder; print("Pillow/Tk bridge imports OK")'

      - name: Test spectra viewer before freezing
        run: |
          xvfb-run -a .venv/bin/python - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from orca_ped_analyzer_gui import SpectraViewer

          with tempfile.TemporaryDirectory() as tmp:
              spectrum = Path(tmp) / 'selftest_IR_fundamentals.dat'
              spectrum.write_text('400 0.0\n800 0.6\n1200 1.0\n1600 0.3\n', encoding='utf-8')
              root = tk.Tk()
              root.withdraw()
              viewer = SpectraViewer(root, [spectrum])
              root.update_idletasks()
              root.update()
              viewer.destroy()
              root.destroy()
          print('SpectraViewer/Tk/Pillow test OK')
          PY

      - name: Build Linux application
        run: |
          .venv/bin/pyinstaller --noconfirm --clean --windowed --onedir \
            --collect-all PIL \
            --hidden-import=PIL._imagingtk \
            --hidden-import=PIL._tkinter_finder \
            --name ORCA-PED-Analyzer orca_ped_analyzer_gui.py

          mkdir -p ORCA-PED-Analyzer.AppDir/usr/bin
          cp -a dist/ORCA-PED-Analyzer/. ORCA-PED-Analyzer.AppDir/usr/bin/
          cp generated-icons/orca-ped-analyzer.png ORCA-PED-Analyzer.AppDir/orca-ped-analyzer.png
          cp generated-icons/orca-ped-analyzer.png ORCA-PED-Analyzer.AppDir/.DirIcon
          cat > ORCA-PED-Analyzer.AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ORCA-PED-Analyzer" "$@"
          EOF
          chmod +x ORCA-PED-Analyzer.AppDir/AppRun
          cat > ORCA-PED-Analyzer.AppDir/orca-ped-analyzer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ORCA PED Analyzer
          Comment=PED and vibrational-mode analysis for ORCA Hessian/VPT2 outputs
          Exec=ORCA-PED-Analyzer
          Icon=orca-ped-analyzer
          Terminal=false
          Categories=Science;Education;
          EOF
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage \
            ORCA-PED-Analyzer.AppDir \
            "ORCA-PED-Analyzer-v${VERSION}-Linux-x86_64.AppImage"
          chmod +x "ORCA-PED-Analyzer-v${VERSION}-Linux-x86_64.AppImage"

      - name: Smoke-test frozen Linux GUI
        run: |
          set +e
          timeout --signal=TERM 10s xvfb-run -a ./dist/ORCA-PED-Analyzer/ORCA-PED-Analyzer
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Frozen GUI exited unexpectedly with status $status"
            exit "$status"
          fi
          echo "Frozen GUI started successfully under Xvfb."

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x86_64
          path: ORCA-PED-Analyzer-v${{ env.VERSION }}-Linux-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows executable (x86_64)
    needs: prepare-icons
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: desktop-icons
          path: generated-icons

      - name: Read application version
        shell: pwsh
        run: |
          $match = Get-Content orca_ped_analyzer.py | Select-String '^__version__\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'Version not found' }
          $version = $match.Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==6.21.0"
          python -c "import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print('GUI imports OK')"
          python -c "from PIL import _imagingtk, _tkinter_finder; print('Pillow/Tk bridge imports OK')"

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --collect-all PIL --hidden-import=PIL._imagingtk --hidden-import=PIL._tkinter_finder --icon generated-icons/orca-ped-analyzer.ico --name ORCA-PED-Analyzer orca_ped_analyzer_gui.py
          Move-Item "dist/ORCA-PED-Analyzer.exe" "ORCA-PED-Analyzer-v$env:VERSION-Windows-x86_64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x86_64
          path: ORCA-PED-Analyzer-v${{ env.VERSION }}-Windows-x86_64.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS DMG (Apple Silicon)
    needs: prepare-icons
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: desktop-icons
          path: generated-icons

      - name: Read application version
        run: |
          VERSION="$(python -c 'import re,pathlib; t=pathlib.Path("orca_ped_analyzer.py").read_text(); print(re.search(r"^__version__\s*=\s*\"([^\"]+)\"", t, re.M).group(1))')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller==6.21.0'
          python -c 'import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print("GUI imports OK")'
          python -c 'from PIL import _imagingtk, _tkinter_finder; print("Pillow/Tk bridge imports OK")'

      - name: Build macOS Apple Silicon application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --collect-all PIL --hidden-import=PIL._imagingtk --hidden-import=PIL._tkinter_finder --icon generated-icons/orca-ped-analyzer.icns --name 'ORCA PED Analyzer' orca_ped_analyzer_gui.py
          mkdir dmg-stage
          ditto 'dist/ORCA PED Analyzer.app' 'dmg-stage/ORCA PED Analyzer.app'
          hdiutil create \
            -volname 'ORCA PED Analyzer' \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "ORCA-PED-Analyzer-v${VERSION}-macOS-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64
          path: ORCA-PED-Analyzer-v${{ env.VERSION }}-macOS-arm64.dmg
          if-no-files-found: error

  macos-intel:
    name: macOS DMG (Intel x86_64)
    needs: prepare-icons
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: desktop-icons
          path: generated-icons

      - name: Read application version
        run: |
          VERSION="$(python -c 'import re,pathlib; t=pathlib.Path("orca_ped_analyzer.py").read_text(); print(re.search(r"^__version__\s*=\s*\"([^\"]+)\"", t, re.M).group(1))')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller==6.21.0'
          python -c 'import tkinter, numpy, orca_ped_analyzer, orca_ped_analyzer_gui; print("GUI imports OK")'
          python -c 'from PIL import _imagingtk, _tkinter_finder; print("Pillow/Tk bridge imports OK")'

      - name: Build macOS Intel application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --collect-all PIL --hidden-import=PIL._imagingtk --hidden-import=PIL._tkinter_finder --icon generated-icons/orca-ped-analyzer.icns --name 'ORCA PED Analyzer' orca_ped_analyzer_gui.py
          mkdir dmg-stage
          ditto 'dist/ORCA PED Analyzer.app' 'dmg-stage/ORCA PED Analyzer.app'
          hdiutil create \
            -volname 'ORCA PED Analyzer' \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "ORCA-PED-Analyzer-v${VERSION}-macOS-x86_64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-x86_64
          path: ORCA-PED-Analyzer-v${{ env.VERSION }}-macOS-x86_64.dmg
          if-no-files-found: error

  publish-release-assets:
    name: Attach desktop builds to tagged release
    if: startsWith(inputs.source_ref, 'v')
    needs: [linux-appimage, windows-exe, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.source_ref }}
          files: release-assets/*
          fail_on_unmatched_files: true
