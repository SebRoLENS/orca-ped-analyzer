name: Build manual PDF (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Build current PDF manual
        run: |
          pandoc docs/ORCA_PED_Analyzer_Manual.md \
            --from markdown \
            --resource-path=.:docs \
            --pdf-engine=xelatex \
            --output docs/ORCA_PED_Analyzer_Manual.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: ORCA-PED-Analyzer-manual
          path: docs/ORCA_PED_Analyzer_Manual.pdf
          if-no-files-found: error
