name: Prepare v2.9.0 metadata

on:
  push:
    paths:
      - '.github/workflows/prepare-v2.9.0.yml'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Update version metadata
        run: |
          sed -i 's/__version__ = "2\.8\.0"/__version__ = "2.9.0"/' orca_ped_analyzer.py
          sed -i 's/2\.8\.0/2.9.0/g' README.md
          sed -i 's/version: "2\.8\.0"/version: "2.9.0"/' CITATION.cff
      - name: Commit version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca_ped_analyzer.py README.md CITATION.cff
          git commit -m 'Bump version to 2.9.0'
          git push origin HEAD:main
