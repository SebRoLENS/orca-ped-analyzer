name: Finish v2.9.1 Zenodo DOI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finish-v2.9.1-doi.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Find and apply v2.9.1 DOI
        id: zenodo
        run: |
          DOI="$(python3 .github/scripts/sync_zenodo_doi.py --version 2.9.1 --apply)"
          echo "doi=$DOI" >> "$GITHUB_OUTPUT"
          echo "Found DOI: $DOI"

      - name: Commit DOI metadata
        env:
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CITATION.cff
          if git diff --cached --quiet; then
            echo 'README and CITATION.cff already up to date.'
          else
            git commit -m "Link v2.9.1 to Zenodo DOI ${DOI}"
            git push origin HEAD:main
          fi

      - name: Update v2.9.1 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## ORCA PED Analyzer v2.9.1

          Automated release generated after an update to ORCA PED Analyzer.

          Desktop applications are available for Linux x86_64, Windows x86_64,
          macOS Apple Silicon, and macOS Intel.

          **Zenodo DOI:** https://doi.org/${DOI}
          EOF
          gh release edit v2.9.1 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
