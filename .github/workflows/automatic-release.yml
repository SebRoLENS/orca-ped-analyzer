name: Automatic release

on:
  push:
    branches:
      - main
    paths:
      - 'orca_ped_analyzer.py'
      - 'orca_ped_analyzer_gui.py'
      - '.release-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: orca-ped-analyzer-release-pipeline
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test and manual dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Validate source before release
        run: |
          python -m py_compile orca_ped_analyzer.py orca_ped_analyzer_gui.py
          python -m unittest discover -s tests -v

      - name: Prepare next version
        id: prepare
        run: |
          VERSION="$(python3 .github/scripts/prepare_release.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing ORCA PED Analyzer v$VERSION"

      - name: Build versioned PDF manual
        run: |
          pandoc docs/ORCA_PED_Analyzer_Manual.md \
            --from markdown \
            --resource-path=.:docs \
            --pdf-engine=xelatex \
            --output docs/ORCA_PED_Analyzer_Manual.pdf

      - name: Validate prepared release
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          python -m py_compile orca_ped_analyzer.py orca_ped_analyzer_gui.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          import re
          from pathlib import Path
          version = '${{ steps.prepare.outputs.version }}'
          text = Path('orca_ped_analyzer.py').read_text()
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.M)
          if not m or m.group(1) != version:
              raise SystemExit(f'Core version mismatch: expected {version}')
          for path in ['README.md', 'docs/ORCA_PED_Analyzer_Manual.md', 'CITATION.cff']:
              if version not in Path(path).read_text():
                  raise SystemExit(f'{path} does not contain release version {version}')
          if not Path('docs/ORCA_PED_Analyzer_Manual.pdf').is_file():
              raise SystemExit('Versioned PDF manual was not generated')
          print(f'Release metadata validated for v{version}')
          PY

      - name: Commit release metadata
        id: commit
        run: |
          set -euo pipefail
          VERSION="${{ steps.prepare.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca_ped_analyzer.py README.md CITATION.cff \
            docs/ORCA_PED_Analyzer_Manual.md docs/ORCA_PED_Analyzer_Manual.pdf
          git commit -m "Prepare v${VERSION} release"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; refusing to overwrite it."
            exit 1
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## ORCA PED Analyzer v${VERSION}

          Automated release generated from validated source on main.

          Desktop applications are being built automatically for Linux x86_64,
          Windows x86_64, macOS Apple Silicon, and macOS Intel.

          **Zenodo DOI:** pending automatic archival.
          EOF
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORCA PED Analyzer v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      - name: Dispatch and wait for desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run build-desktop-apps.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_ref=v${VERSION}"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-desktop-apps.yml/runs?event=workflow_dispatch&per_page=20" \
              --jq ".workflow_runs[] | select(.created_at >= \"${DISPATCHED_AT}\") | .id" | head -n1)"
            [ -n "$RUN_ID" ] && break
            sleep 4
          done
          [ -n "$RUN_ID" ] || { echo 'Could not locate desktop-build run.'; exit 1; }
          echo "Desktop-build run: $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in \
            "ORCA-PED-Analyzer-v${VERSION}-Linux-x86_64.AppImage" \
            "ORCA-PED-Analyzer-v${VERSION}-Windows-x86_64.exe" \
            "ORCA-PED-Analyzer-v${VERSION}-macOS-arm64.dmg" \
            "ORCA-PED-Analyzer-v${VERSION}-macOS-x86_64.dmg" \
            "SHA256SUMS.txt"; do
            echo "$ASSETS" | grep -Fx "$asset" >/dev/null || { echo "Missing release asset: $asset"; exit 1; }
          done

      - name: Try Zenodo synchronization
        id: zenodo
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          DOI=""
          for attempt in $(seq 1 15); do
            set +e
            DOI="$(python3 .github/scripts/sync_zenodo_doi.py --version "$VERSION")"
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ] && [ -n "$DOI" ]; then
              echo "Found Zenodo DOI: $DOI"
              break
            fi
            echo "Zenodo record for v${VERSION} not visible yet (${attempt}/15)."
            sleep 60
          done
          echo "doi=$DOI" >> "$GITHUB_OUTPUT"
          if [ -z "$DOI" ]; then
            echo "Zenodo is still pending; scheduled DOI synchronization will retry later."
          fi

      - name: Commit DOI and citation metadata
        if: steps.zenodo.outputs.doi != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 .github/scripts/sync_zenodo_doi.py --version "$VERSION" --apply >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CITATION.cff
          if ! git diff --cached --quiet; then
            git commit -m "Link v${VERSION} to Zenodo DOI ${DOI}"
            git push origin HEAD:main
          fi

      - name: Finalize GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          if [ -n "$DOI" ]; then
            DOI_LINE="**Zenodo DOI:** https://doi.org/${DOI}"
          else
            DOI_LINE="**Zenodo DOI:** pending automatic archival; scheduled synchronization is active."
          fi
          cat > /tmp/release-notes.md <<EOF
          ## ORCA PED Analyzer v${VERSION}

          Validated automated release.

          Desktop applications are available for Linux x86_64, Windows x86_64,
          macOS Apple Silicon, and macOS Intel. SHA-256 checksums are included.

          ${DOI_LINE}
          EOF
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
