name: Automatic release

on:
  push:
    branches:
      - main
    paths:
      - 'orca_ped_analyzer.py'
      - 'orca_ped_analyzer_gui.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-release
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Prepare next version
        id: prepare
        run: |
          VERSION="$(python3 .github/scripts/prepare_release.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing ORCA PED Analyzer v$VERSION"

      - name: Commit release metadata
        id: commit
        run: |
          VERSION="${{ steps.prepare.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca_ped_analyzer.py README.md CITATION.cff
          git commit -m "Prepare v${VERSION} release"
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## ORCA PED Analyzer v${VERSION}

          Automated release generated after an update to the ORCA PED Analyzer source code.

          Desktop applications are built automatically for Linux x86_64, Windows x86_64,
          macOS Apple Silicon, and macOS Intel.

          **Zenodo DOI:** pending automatic archival.
          EOF

          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORCA PED Analyzer v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      - name: Dispatch desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          gh workflow run build-desktop-apps.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_ref=v${VERSION}"

          echo "Waiting for the desktop-build workflow to start..."
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/build-desktop-apps.yml/runs?event=workflow_dispatch&head_sha=${RELEASE_SHA}&per_page=10" \
                --jq '.workflow_runs[0].id // empty'
            )"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 4
          done

          if [ -z "$RUN_ID" ]; then
            echo "Could not locate the dispatched desktop-build run."
            exit 1
          fi

          echo "Desktop-build run: $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

  sync-zenodo-doi:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for Zenodo GitHub integration
        id: zenodo
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          DOI=""
          for attempt in $(seq 1 60); do
            set +e
            DOI="$(python3 .github/scripts/sync_zenodo_doi.py --version "$VERSION" 2>/dev/null)"
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ] && [ -n "$DOI" ]; then
              echo "Found Zenodo DOI: $DOI"
              break
            fi
            echo "Zenodo record for v${VERSION} not visible yet (attempt ${attempt}/60)."
            sleep 60
          done

          if [ -z "$DOI" ]; then
            echo "Zenodo DOI was not found within one hour."
            echo "Rerun this workflow manually after Zenodo has archived the release."
            exit 1
          fi

          python3 .github/scripts/sync_zenodo_doi.py --version "$VERSION" --apply >/dev/null
          echo "doi=$DOI" >> "$GITHUB_OUTPUT"

      - name: Commit DOI and citation metadata
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CITATION.cff
          if git diff --cached --quiet; then
            echo "README and CITATION.cff are already up to date."
            exit 0
          fi
          git commit -m "Link v${VERSION} to Zenodo DOI ${DOI}"
          git push origin HEAD:main

      - name: Add DOI to GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## ORCA PED Analyzer v${VERSION}

          Automated release generated after an update to the ORCA PED Analyzer source code.

          Desktop applications are available for Linux x86_64, Windows x86_64,
          macOS Apple Silicon, and macOS Intel.

          **Zenodo DOI:** https://doi.org/${DOI}
          EOF

          gh release edit "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/release-notes.md
