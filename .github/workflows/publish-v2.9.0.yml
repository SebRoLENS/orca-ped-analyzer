name: Publish v2.9.0

on:
  push:
    paths:
      - '.github/workflows/publish-v2.9.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Create v2.9.0 release and tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.9.0
          target_commitish: main
          name: ORCA PED Analyzer v2.9.0
          body_path: docs/RELEASE_NOTES_v2.9.0.md
      - name: Build and attach desktop applications
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-desktop-apps.yml',
              ref: 'v2.9.0'
            })
