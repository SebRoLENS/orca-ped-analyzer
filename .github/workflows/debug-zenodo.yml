name: Debug Zenodo metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/debug-zenodo.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Zenodo API
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          tests = [
              ('base', {'size': 5}),
              ('quoted title', {'q': '"ORCA PED Analyzer"', 'size': 50}),
              ('plain title', {'q': 'ORCA PED Analyzer', 'size': 50}),
              ('version', {'q': '2.9.1', 'size': 50}),
          ]
          for label, params in tests:
              print(f'\n=== {label} ===')
              url = 'https://zenodo.org/api/records?' + urllib.parse.urlencode(params)
              print('URL:', url)
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'orca-ped-analyzer-debug/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.load(r)
              except urllib.error.HTTPError as exc:
                  print('HTTP', exc.code)
                  try:
                      print(exc.read().decode('utf-8', 'replace'))
                  except Exception:
                      pass
                  continue
              except Exception as exc:
                  print('ERROR', repr(exc))
                  continue
              hits = ((payload.get('hits') or {}).get('hits') or [])
              print('hits:', len(hits))
              for rec in hits:
                  md = rec.get('metadata') or {}
                  title = str(md.get('title',''))
                  version = md.get('version')
                  if 'orca ped analyzer' not in title.lower() and '2.9.1' not in str(version):
                      continue
                  print(json.dumps({
                      'id': rec.get('id'),
                      'title': md.get('title'),
                      'version': version,
                      'doi': rec.get('doi'),
                      'pids': rec.get('pids'),
                      'parent': rec.get('parent'),
                  }, ensure_ascii=False, indent=2))
          PY
