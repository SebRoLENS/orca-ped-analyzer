name: Debug Zenodo metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/debug-zenodo.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Zenodo records
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          queries = [
              '"ORCA PED Analyzer"',
              'ORCA PED Analyzer',
              'metadata.version:"2.9.1"',
              'metadata.version:"v2.9.1"',
              '2.9.1 ORCA PED Analyzer',
          ]
          seen = set()
          for q in queries:
              print(f"\n=== QUERY: {q} ===")
              url = 'https://zenodo.org/api/records?' + urllib.parse.urlencode({'q': q, 'size': 100, 'sort': 'newest'})
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'orca-ped-analyzer-debug/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.load(r)
              except Exception as exc:
                  print('ERROR', repr(exc))
                  continue
              hits = ((payload.get('hits') or {}).get('hits') or [])
              print('hits:', len(hits))
              for rec in hits:
                  md = rec.get('metadata') or {}
                  title = str(md.get('title',''))
                  version = md.get('version')
                  # Keep output focused on likely project records.
                  if 'orca ped analyzer' not in title.lower() and '2.9.1' not in str(version):
                      continue
                  key = rec.get('id')
                  if (q, key) in seen:
                      continue
                  seen.add((q,key))
                  print(json.dumps({
                      'id': rec.get('id'),
                      'title': md.get('title'),
                      'version': version,
                      'doi': rec.get('doi'),
                      'pids': rec.get('pids'),
                      'created': rec.get('created'),
                      'updated': rec.get('updated'),
                      'links': rec.get('links'),
                      'parent': rec.get('parent'),
                  }, ensure_ascii=False, indent=2))
          PY
