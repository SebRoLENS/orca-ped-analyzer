name: Add development disclaimer to manual

on:
  push:
    paths:
      - '.github/workflows/update-manual-v2.9.0.yml'

permissions:
  contents: write

jobs:
  update-manual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Insert disclaimer
        env:
          DISCLAIMER_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          p = Path('docs/ORCA_PED_Analyzer_Manual.md')
          text = p.read_text(encoding='utf-8')
          section = base64.b64decode(os.environ['DISCLAIMER_B64']).decode('utf-8')
          if '# 21. Development and validation disclaimer' not in text:
              marker = '\\newpage\n\n# Appendix A - How the script assigns normal modes: from the Hessian to a chemical label'
              if marker not in text:
                  raise SystemExit('Appendix marker not found')
              text = text.replace(marker, section + '\n\\newpage\n\n# Appendix A - How the script assigns normal modes: from the Hessian to a chemical label', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Build PDF manual
        run: |
          pandoc docs/ORCA_PED_Analyzer_Manual.md \
            --from markdown \
            --pdf-engine=xelatex \
            --output docs/ORCA_PED_Analyzer_Manual.pdf

      - name: Commit updated manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ORCA_PED_Analyzer_Manual.md docs/ORCA_PED_Analyzer_Manual.pdf
          git commit -m 'Add development and validation disclaimer to manual'
          git push origin HEAD:main
