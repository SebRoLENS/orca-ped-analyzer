name: Update manual for v2.9.0 desktop apps

on:
  push:
    paths:
      - '.github/workflows/update-manual-v2.9.0.yml'

permissions:
  contents: write

jobs:
  update-manual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update Markdown manual
        env:
          NEW_SECTION_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          p = Path('docs/ORCA_PED_Analyzer_Manual.md')
          text = p.read_text(encoding='utf-8')

          text = text.replace('date: "Version 2026.08.11-vpt2.8"', 'date: "Version 2.9.0"')
          text = text.replace('# 1. Main features of version 2.8', '# 1. Main features of version 2.9.0')
          text = text.replace('Version 2.8 keeps the preceding translational/rotational entries', 'Version 2.9.0 keeps the preceding translational/rotational entries')
          text = text.replace('# 4. Quick start', '# 4. Command-line quick start')

          old_start = text.index('# 2. Requirements and version check')
          old_end = text.index('# 3. Which Hessian should be used?')
          new_section = base64.b64decode(os.environ['NEW_SECTION_B64']).decode('utf-8')
          text = text[:old_start] + new_section + text[old_end:]

          marker = '# 1. Main features of version 2.9.0\n\n'
          if marker in text and '**Desktop applications.**' not in text:
              text = text.replace(marker, marker + '- **Desktop applications.** Pre-built Linux AppImage, Windows executable and macOS DMG packages provide a graphical interface without requiring a local Python installation.\n', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Build PDF manual
        run: |
          pandoc docs/ORCA_PED_Analyzer_Manual.md --from markdown --pdf-engine=xelatex --output docs/ORCA_PED_Analyzer_Manual.pdf

      - name: Upload manual PDF for verification
        uses: actions/upload-artifact@v4
        with:
          name: ORCA-PED-Analyzer-Manual-v2.9.0
          path: docs/ORCA_PED_Analyzer_Manual.pdf
          if-no-files-found: error

      - name: Commit updated manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ORCA_PED_Analyzer_Manual.md docs/ORCA_PED_Analyzer_Manual.pdf
          git commit -m 'Update manual for v2.9.0 desktop applications'
          git push origin HEAD:main
